name: Role Creator
description: "Creates, verifies, and iterates on rolebox roles. Triggers: create a role, scaffold, add a subagent/skill/function, verify/benchmark a role, fix a broken role."
version: "1.0.0"
mode: primary
prompt_file: PROMPT.md

references:
  schema/validation-catalog:
    path: references/schema/validation-catalog.md
    description: Frozen rolebox validation contract — the rule source for all Tier 1/2 checks.
  schema/role-yaml-schema:
    path: references/schema/role-yaml-schema.md
    description: Field-by-field role.yaml and SubAgentConfig schema dictionary.
  graph-protocol:
    path: references/graph-protocol.md
    description: Canonical rolebox Graph v3 protocol — tool surface, declaration grammar, accepted-outcome transport and bounded recovery.
  conventions/graph-orchestrated:
    path: references/conventions/graph-orchestrated.md
    description: Authoring recipe for the graph-orchestrated template — one v3 declaration per request and the declarer tool split.
  conventions/simple:
    path: references/conventions/simple.md
    description: Conventions for the simple (single-prompt) role template.
  conventions/director-gated:
    path: references/conventions/director-gated.md
    description: Conventions for the director-gated (dispatch-through-gates) role template.
  conventions/nested-statemachine:
    path: references/conventions/nested-statemachine.md
    description: Conventions for the nested state-machine (reactive orchestration) role template.
  templates/eval-set:
    path: references/templates/eval-set.md
    description: Eval set format, scenario format, deterministic checks, and pass thresholds.

functions:
  - scaffold
  - verify
  - iterate
  # loop removed (Phase C): the loop_* function family is retired; bounded cycles
  # are declared as a loop_groups entry in a Graph v3 declaration.
  # deploy: deploy-to-harness capability — functions/deploy.md is authored in a later subtask
  - deploy

skills:
  - role-creator-conventions
  - role-creator-schema
  - role-creator-verification

# The declarer split: this primary session declares, controls, reads and audits
# graphs. It never submits a worker outcome and never runs a worker command; the
# generated subagents hold the inverse split. Every generated role must declare
# the same machine-checkable marker in its own tools: block.
tools:
  graph_declare: true
  graph_control: true
  graph_status: true
  graph_audit: true
  graph_submit_outcome: false
  graph_worker_exec: false
  Write: true
  Edit: true
  Bash: true

permission:
  allow:
    - Read
    - Grep
    - Glob
    - Bash
    - Edit
    - Write
    # Removed (Phase C): the legacy dispatch family (Dispatch / dispatch_output /
    # dispatch_cancel) is gone.
    - graph_declare
    - graph_control
    - graph_status
    - graph_audit
