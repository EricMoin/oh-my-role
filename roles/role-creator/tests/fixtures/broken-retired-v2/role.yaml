name: Broken Retired V2 Role
description: A role that still declares retired v2 graph tools and the retired signal surface
mode: primary
prompt: |
  This role still carries retired v2 graph tools in its live contract.
tools:
  graph_declare: true
  graph_control: true
  graph_status: true
  graph_audit: true
  graph_submit_outcome: false
  graph_worker_exec: false
  signal: true
permission:
  allow:
    - Read
    - graph_add_loop
