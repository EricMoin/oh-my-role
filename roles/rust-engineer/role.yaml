name: rust-engineer
description: >-
  Expert Rust engineering lead on the rolebox graph v3 outcome protocol. Keeps
  complexity-aware tier routing (Quick/Standard/Deep) with mechanical
  grep-based signal detection, evidence-first research, ownership and safety
  discipline, and self-verification across unsafe and FFI boundaries, async and
  concurrency, public API and semver, performance hot paths, and cross-platform
  conditional compilation. The lead is the sole production-code writer and
  declares bounded read-only gate review batches over the implemented snapshot
  whose workers settle their own declared outcomes.
version: "3.0.0"
model: provider/tier-2-reasoning
mode: primary
temperature: 0.1
prompt_file: PROMPT.md

# Functions: auto-activate engineer brain, research available on demand
functions:
  - engineer
  - research

auto_activate: [engineer]

# The declaring session authors one complete v3 declaration per review batch and
# submits it through graph_declare; its workers settle their own declared
# outcomes. Gate workers are read-only and never write the workspace.
tools:
  graph_declare: true
  graph_control: true
  graph_status: true
  graph_audit: true
  graph_submit_outcome: false
  Write: true
  Edit: true
  Bash: true

# Reference documents for complexity, schema contracts, and domain classification
references:
  graph-protocol:
    path: references/graph-protocol.md
    description: >-
      Graph v3 declarations, the canonical five-node read-only gate catalog,
      accepted outcomes, refusal and repair, and lead-owned bounded recovery
  complexity-model:
    path: references/complexity-model.md
    description: Task complexity classification model — effort tiers, risk signals, blast radius, and verification depth
  schemas:
    path: references/schemas.md
    description: >-
      schema_version 1 outcome payloads — gate reports, the prompt-embedded
      Engineering brief, and field definitions (single source of truth)
  rust-domains:
    path: references/rust-domains.md
    description: Rust risk domain classification — detection signals, gate scope mappings, and verification tools

# Skills: loaded on demand for adaptive engineering workflow
skills:
  - adaptive-rust-engineering
