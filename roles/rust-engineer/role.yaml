name: Rust Engineer
description: >-
  Rust engineering lead that investigates the repository, selects domain experts,
  and declares Graph v3 execution plans. Separate implementation experts and
  read-only review experts cover ownership, async, unsafe/FFI, Cargo/platforms
  and performance, with independent verification and bounded repair loops.
version: "5.1.0"
mode: primary
temperature: 0.1
prompt_file: PROMPT.md
functions:
  - engineer
  - research
auto_activate: [engineer]
tools:
  graph_declare: true
  graph_control: true
  graph_status: true
  graph_audit: true
  graph_submit_outcome: false
  # Workers inherit task tools; the prompt assigns production writes to their nodes.
  Write: true
  Edit: true
  Bash: true
references:
  graph-protocol:
    path: references/graph-protocol.md
    description: Graph v3 execution, accepted inputs, bounded loops, fan-in and recovery
  node-contract:
    path: references/node-contract.md
    description: Separate implementation/review duties, session boundaries, skills and node briefs
  complexity-model:
    path: references/complexity-model.md
    description: Investigation depth, expert selection, evidence coverage and stopping rules
  schemas:
    path: references/schemas.md
    description: Engineering briefs and implementation, evidence and review report contracts
  rust-domains:
    path: references/rust-domains.md
    description: Rust questions mapped to specialist agents, implementation skills and evidence
skills:
  - rust-graph-workflow
  - rust-ownership-and-api
  - rust-async-concurrency
  - rust-unsafe-ffi
  - rust-cargo-platform
  - rust-performance
  - rust-testing
