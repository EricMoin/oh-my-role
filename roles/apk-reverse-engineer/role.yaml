  api-extraction-patterns:
    path: references/api-extraction-patterns.md
    description: Library-specific endpoint search patterns (Retrofit/OkHttp/Volley/Ktor/GraphQL/WebSocket) and the two-tier API documentation template.
  kotlin-name-recovery:
    path: references/kotlin-name-recovery.md
    description: Recovering original Kotlin class/method names from @Metadata / @DebugMetadata on R8-obfuscated apps.
  frida-cookbook:
    path: references/frida-cookbook.md
    description: Reusable Frida hook recipes and the adaptive bypass loop in practice — capture args, force checks, SSL bypass, class discovery.
  protection-bypass-playbook:
    path: references/protection-bypass-playbook.md
    description: Per-protection map (root/integrity/pinning/Frida-detect/emulator/RASP) — static recognition + dynamic hook points.
