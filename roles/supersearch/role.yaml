name: SuperSearch
description: >-
  Aggressive evidence-backed search specialist on the rolebox graph v3 outcome
  protocol. Triangulates across independent channels — local files, code, git
  history, web pages, GitHub, official documentation, package metadata,
  sessions, and visual/document sources — and never stops at the first plausible
  answer. Quick single-channel questions are answered directly; a Deep
  multi-channel search declares exactly one bounded read-only search graph
  (channel-fanout or single-channel-plus-audit) whose local, web and source
  scouts and whose evidence auditor settle their own declared outcomes, and a
  report request adds the HTML deliverable. Read-only: the only writes are
  temporary custom-scraping scripts in .rolebox/scratch/ and the report in
  .rolebox/reports/.
version: "2.0.0"
mode: primary
temperature: 0.15
auto_activate:
  - search
prompt_file: PROMPT.md
skills:
  - supersearch-tool-selection
  - supersearch-query-strategy
  - supersearch-local-discovery
  - supersearch-web-discovery
  - supersearch-evidence-synthesis
  - supersearch-reporting
  - supersearch-custom-scraping
  - supersearch-html-report
references:
  graph-protocol:
    path: references/graph-protocol.md
    description: >-
      Graph v3 search-graph declarations, the channel-fanout and
      single-channel-plus-audit templates, declared outcomes, accepted results,
      refusal and repair, and lead-owned bounded recovery
  schemas:
    path: references/schemas.md
    description: >-
      schema_version 1 outcome payloads — scout-report and audit-report field
      definitions and the non-success blocked, failed and clarification_required
      payloads (single source of truth)
  graph-examples:
    path: references/graph-examples.json
    description: >-
      Structurally complete channel-fanout and single-channel-plus-audit
      declarations; replace their prompt placeholders with task-specific briefs
functions:
  - plan
  - search
  - verify
permission:
  allow:
    - Read
    - Write
    - Bash
    - Grep
    - Glob
    - Question
    - WebFetch
    - websearch_web_search_exa
    - grep_app_searchgithub
    - context7_resolve-library-id
    - context7_query-docs
    - ast_grep_search
    - lsp_goto_definition
    - lsp_find_references
    - lsp_symbols
    - lsp_diagnostics
    - session_search
    - session_read
    - session_list
    - session_info
    - look_at
    - skill
    - skill_mcp
    - graph_declare
    - graph_control
    - graph_status
    - graph_audit
    - web_fetch
    - web_search
    - web_read
    - reference_search
    - context_assemble
    - memory_recall
    - memory_list
    - memory_write
    - memory_update
    - lsp_workspace_symbols
    - lsp_document_symbols
    - lsp_hover
    - lsp_goto_implementation
    - lsp_goto_type_definition
    - lsp_prepare_call_hierarchy
    - lsp_incoming_calls
    - lsp_outgoing_calls
    - session_diff
    - session_changes
    - session_fork
    - session_branch
    - asset_search
    - asset_inspect
  deny:
    - Edit
    - MultiEdit
    - ApplyPatch
    - apply_patch
    - ast_grep_replace
    - lsp_rename
    - lsp_prepare_rename
# The declaring session authors one complete v3 declaration per Deep request and
# submits it through graph_declare; its scout and auditor workers settle their
# own declared outcomes and never write the workspace outside the documented
# scratch/report exceptions.
tools:
  graph_declare: true
  graph_control: true
  graph_status: true
  graph_audit: true
  graph_submit_outcome: false
  graph_worker_exec: false
  Write: true
  Edit: true
  Bash: true
  web_fetch: true
  web_search: true
  web_read: true
  reference_search: true
  context_assemble: true
  memory_recall: true
  memory_list: true
  memory_write: true
  memory_update: true
  lsp_workspace_symbols: true
  lsp_document_symbols: true
  lsp_hover: true
  lsp_goto_implementation: true
  lsp_goto_type_definition: true
  lsp_prepare_call_hierarchy: true
  lsp_incoming_calls: true
  lsp_outgoing_calls: true
  session_diff: true
  session_changes: true
  session_fork: true
  session_branch: true
  asset_search: true
  asset_inspect: true
  MultiEdit: false
  ApplyPatch: false
  edit: false
  write: true
  apply_patch: false
  ast_grep_replace: false
  lsp_rename: false
  lsp_prepare_rename: false
