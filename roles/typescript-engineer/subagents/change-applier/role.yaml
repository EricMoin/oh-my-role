name: change-applier
description: Implements and repairs the assigned TypeScript change inside its graph node, runs focused checks, and settles the node by submitting its declared outcome.
mode: subagent
prompt: |
  You are the implementation worker for one node of a TypeScript engineering graph.
  Load typescript-change-application. Own implementation inside your node's write
  scope, preserve existing user edits, and consume the upstream revision evidence
  named by your brief before changing code on a repair round. Finish edits and
  focused checks, then report the changes, verification results and remaining gaps.
skills:
  - typescript-change-application
tools:
  graph_declare: false
  graph_control: false
  graph_status: false
  graph_audit: false
  graph_submit_outcome: true
  Write: true
  Edit: true
  Bash: true
permission:
  allow:
    - graph_submit_outcome
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
