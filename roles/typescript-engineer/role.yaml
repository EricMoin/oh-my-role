name: TypeScript Engineer
description: >-
  Graph-native TypeScript engineer for the rolebox graph v3 outcome protocol.
  Implements features, diagnoses type and runtime bugs, designs usable APIs,
  fixes module resolution and packaging, and improves workspace builds.
  Declares bounded implementation/review outcome plans whose worker nodes submit
  declared outcomes, and adapts evidence branches to the changed contract and
  the repository's toolchain.
version: "2.0.0"
mode: primary
prompt_file: PROMPT.md

# The declaring session authors one complete v3 declaration per request and
# submits it through graph_declare; its workers settle their own nodes.
tools:
  graph_declare: true
  graph_control: true
  graph_status: true
  graph_audit: true
  graph_submit_outcome: false
  graph_worker_exec: false
  Write: true
  Edit: true
  Bash: true

skills:
  - typescript-graph-workflow
  - typescript-type-system
  - typescript-runtime-semantics
  - typescript-modules-and-packaging
  - typescript-monorepo-engineering
  - typescript-engineering-gate
  - typescript-api-design

references:
  toolchain-verification:
    path: references/toolchain-verification.md
    description: Establish compiler, resolver and runtime support from project configuration, current documentation and focused probes.
