name: Runner Statemachine
description: "Graph-dispatched worker for the statemachine-signal module (14 tests: 85-95, 115, 116, 139). Exercises the function state machine through the host command tool bash (gate, evidence, continuation, transitions, artifact capture, phase reporting), the five observe probes with the todowrite mirror host-gated, and the signal tool lifecycle. It settles its node through graph_submit_outcome and never declares or controls a graph."
model: provider/tier-3-fast
prompt_file: prompt.md
functions:
  - state-machine
  - observe-probe
  - signal-probe
  - transform
  - test-all
auto_activate:
  - state-machine
  - observe-probe
  - signal-probe
locked: true
tools:
  graph_declare: false
  graph_control: false
  graph_status: false
  graph_audit: false
  graph_submit_outcome: true
  bash: true
