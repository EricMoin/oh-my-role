name: Rolebox Tester
description: "User-directed functional tester for rolebox. Run specific test modules on demand (e.g., node dispatch, live-graph visibility, memory, state machine, LSP) or run the full suite. Covers: skills, Graph Engine v2 imperative node dispatch (single-node/chained/parallel runs, node session continuation, node retry, output truncation, cancel), functions (parameterized/state-machine/observe-probe/signal), references, tools (bash/write/read/grep/glob/edit/hashline), permissions, MCP, todo, collaboration graphs, session tools (info/diff/fork), memory (write/recall/list/update/injection), task management (search/budget/graph/concurrency/chronology/export), asset management (search/inspect/validate/compose/hot-reload), live-graph visibility (graph_status liveness/metrics/concurrency), web/search, LSP, nested dispatch, and structured test report generation. Centered on Graph Engine v2 imperative graph_* coverage: graph_create/add_node/add_edge/add_loop/run/status/cancel/approve, on_condition edges, loop termination + mode, node/graph budgets, node liveness, signal-emitting subagents (signal-answer / signal-revise / signal-escalate / signal-approve) exercising the signal-bridge terminating and pausing signal vocabulary end to end, plus an interactive_terminal smoke test."
version: "5.0.0"
model: provider/tier-3-fast
mode: primary
prompt_file: PROMPT.md

functions:
  - test-all
  - transform
  - loop
  - state-machine
  - observe-probe
  - broken-dep
  - signal-probe

skills:
  - test-skill

references:
  test-reference:
    path: references/test-reference.md
    description: A test reference document to verify reference loading works correctly

subagents:
  - name: Echo
    description: Simple echo subagent for testing dispatch mechanism (sync and async)
    prompt: |
      You are Echo, a test subagent. Your job is simple:
      1. Confirm you received the message by repeating back what was asked.
      2. Report your agent ID as "rolebox-tester--echo".
      3. If asked to do a specific task (math, text transform, etc.), do it and return the result.
      Always respond concisely. Keep responses under 5 sentences.
  - name: Sleeper
    description: Slow subagent for testing async dispatch and cancellation
    prompt: |
      You are Sleeper, a test subagent for async operations.
      When you receive a message:
      1. Acknowledge that you are the Sleeper subagent.
      2. Perform whatever task is requested.
      3. End your response with "SLEEPER_COMPLETE".
      Always respond concisely.
  - name: Processor
    description: First-stage graph agent that processes input and passes to Checker
    prompt: |
      You are Processor, a graph participant agent.
      When you receive a message:
      1. Confirm you are Processor by including "PROCESSOR_RECEIVED" in your response.
      2. Transform the input by appending " [PROCESSED]" to whatever you were given.
      3. Return the transformed result.
      Always respond concisely. Keep responses under 3 sentences.
  - name: Checker
    description: Second-stage graph agent that checks processed output and decides approval
    prompt: |
      You are Checker, a graph participant agent in a review-loop.
      When you receive a message:
      1. Confirm you are Checker by including "CHECKER_RECEIVED" in your response.
      2. Verify the input contains "[PROCESSED]". If it does, respond with "APPROVED" and "GRAPH_FLOW_OK".
      3. If it does not contain "[PROCESSED]", respond with "REVISION_NEEDED" and "GRAPH_FLOW_FAIL".
      Always respond concisely. Keep responses under 3 sentences.
  - name: Signal Answer
    description: Signal-emitting graph agent that always terminates via signal(type="answer") with a fixed ANSWER_SIGNAL_OK marker payload
    prompt_file: subagents/signal-answer/prompt.md
  - name: Signal Revise
    description: Signal-emitting graph agent that always terminates via signal(type="revise_needed") with a fixed REVISE_SIGNAL_OK findings payload
    prompt_file: subagents/signal-revise/prompt.md
  - name: Signal Escalate
    description: Signal-emitting graph agent that always terminates via signal(type="escalate") with a fixed ESCALATE_SIGNAL_OK reason payload
    prompt_file: subagents/signal-escalate/prompt.md
  - name: Signal Approve
    description: Signal-emitting graph agent that always terminates via signal(type="need_approval") with a fixed APPROVAL_GATE_OK summary payload
    prompt_file: subagents/signal-approve/prompt.md




collaboration:
  topology: pipeline
  agents: [processor, checker, validator]
  max_iterations: 2
  termination:
    any_of:
      - max_iterations: 2
      - result_matches:
          agent: validator
          contains: "VALIDATED"

memory:
  inject: true
  max_inject: 10
  min_relevance: medium
  scope: both

dispatch:
  maxConcurrent: 2147483647
  maxQueueDepth: 2147483647
  maxActivePerParent: 2147483647
  syncReservedSlots: 1

auto_activate:
  - test-all
locked: true
