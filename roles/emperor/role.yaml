name: Emperor
description: "Top-level orchestrator — triage, dispatch, synthesize. Never writes code."
version: "2.8.0"
model: provider/tier-1-flagship
color: "#1a1a2e"
mode: primary
# Low temperature: routing/classification and dispatch decisions should be deterministic
temperature: 0.1
prompt_file: PROMPT.md

# Functions: replaces default plan+execute with high-level orchestration modes
functions:
  - triage
  - synthesize
  - effort
  # loop removed (Phase C): loop_* tools deprecated, zero consumers; bounded cycles run via graph_add_loop

auto_activate: [triage, synthesize]

# Skills: loaded on-demand for delegation strategy and failure recovery
skills:
  - delegation-heuristics
  - escalate-recovery
# Reference documents for dispatch decisions, schemas, terminology, model pools, and departments
references:
  schemas:
    path: references/schemas.md
    description: Schema definitions for dispatch payloads, strategy documents, and validation results
  terminology-and-style:
    path: references/terminology-and-style.md
    description: Terminology conventions and English style guide for all emperor-facing output
  model-pool:
    path: references/model-pool.md
    description: Model pool configuration — three independent pools (tier-1-flagship, tier-2-reasoning, tier-3-fast) each with 5-slot semaphore
  departments:
    path: references/departments.md
    description: Department definitions and domain assignments for dispatch routing
  evidence-first-research:
    path: references/evidence-first-research.md
    description: Evidence-first research discipline — citation tiers, triggers, and core principles for verifying external API and library behavior

# Subagent orchestration — collaboration flow declares the graph edges.
# This declarative edge list is the authoring source of truth; at runtime the
# graph engine executes it via graph_create → graph_add_node / graph_add_edge
# (graph_add_loop) → graph_run (see PROMPT.md / functions/synthesize.md).
# Legacy v1 declarative config: max_iterations feeds only the legacy
# rolebox/src/graph/collaboration-bridge.ts bridge and does NOT bound the
# imperative graph_add_loop revise/review cycles (see synthesize.md /
# orchestrate.md). Kept only for schema compatibility; the engine enforces loop bounds.
collaboration:
  max_iterations: 3
  flow:
    - "parent -> chancellor: strategic planning"
    - "parent -> jinyiwei: direct execution"
    - "chancellor -> parent: strategy document"
    - "jinyiwei -> parent: execution result"
    - "parent -> validator: closed-loop validation"
    - "validator -> parent: validation result"
    - "parent -> jinyiwei: re-dispatch failed subtasks"

# Emperor never writes code directly — delegates all implementation to subagents.
# Orchestration runs on the graph engine (graph_create / graph_add_node /
# graph_add_edge / graph_add_loop / graph_run / graph_status / graph_cancel /
# graph_approve). signal stays available (vocabulary-preserved, not deprecated).
tools:
  Write: false
  Edit: false
  Bash: false
  # The legacy dispatch_*/loop_*/function_state family is removed (Phase C).
  # Emitted as explicit denials so no asset accidentally re-introduces them.

permission: allow

# Graph orchestration configuration. The legacy dispatch: block (parent-scoped concurrency
# ceiling / maxConcurrent / syncPromptTimeoutMs / backgroundStaleTimeoutMs) is replaced by the graph
# engine: per-node limits are carried on graph_add_node(timeout_ms/max_retries).
# Resource ceilings, if any, are owned and enforced by the rolebox engine; concurrency is engine-managed.
graph:
  orchestration: graph_v2
  # Declarative edge list above mirrors what graph_add_edge wires at runtime.
