name: Emperor
description: "Top-level orchestrator — triage, dispatch, synthesize. Never writes code."
version: "3.1.0"
model: provider/tier-1-flagship
color: "#1a1a2e"
mode: primary
# Low temperature: routing/classification and dispatch decisions should be deterministic
temperature: 0.1
prompt_file: PROMPT.md

# Functions: replaces default plan+execute with high-level orchestration modes
functions:
  - triage
  - synthesize
  - effort
  # Revisions use fresh DAGs under the request budget in graph-protocol.md.

auto_activate: [triage, synthesize]

# Skills: loaded on-demand for delegation strategy and failure recovery
skills:
  - delegation-heuristics
  - escalate-recovery
# Reference documents for dispatch decisions, schemas, terminology, model pools, and departments
references:
  graph-protocol:
    path: references/graph-protocol.md
    description: Graph v3 execution, authorization, revision and accepted result transport
  schemas:
    path: references/schemas.md
    description: Schema definitions for dispatch payloads, strategy documents, and validation results
  terminology-and-style:
    path: references/terminology-and-style.md
    description: Terminology conventions and English style guide for all emperor-facing output
  model-pool:
    path: references/model-pool.md
    description: Model tier assignments and runtime-owned capacity limits
  departments:
    path: references/departments.md
    description: Department definitions and domain assignments for dispatch routing
  evidence-first-research:
    path: references/evidence-first-research.md
    description: Evidence-first research discipline — citation tiers, triggers, and core principles for verifying external API and library behavior

# The declaring session owns all graph stages; workers only submit outcomes.
tools:
  Write: false
  Edit: false
  Bash: false
  graph_declare: true
  graph_control: true
  graph_status: true
  graph_audit: true
  graph_submit_outcome: false
  graph_worker_exec: false
permission: allow

# Copilot: turn-end decision pipeline (see rolebox docs/copilot.md). The emperor is a
# strict human-in-the-loop orchestrator — approval gates and open design questions are
# hard-stopped by skip rules (deterministic; the LLM judge never sees them), and the
# LLM judge only nudges genuinely stalled turns. skip consumes the decision: no
# injection and no LLM fallthrough — the human must decide.
copilot:
  enabled: true
  llm:
    role: emperor--copilot
    max_verdict_timeout_ms: 30000
    # Replaces the default advisory GUIDANCE verbatim (replace-if-present
    # semantics). Emperor-specific decision classes are encoded here.
    guidance: |
      You are judging one thing: would the user benefit from nudging the emperor — a strict human-in-the-loop orchestrator — to continue RIGHT NOW? Reply with exactly one JSON object, {"advance": true|false, "replyText": "..."}, and nothing else.

      Hand control back (advance: false) when the emperor is waiting for something that will arrive on its own, or waiting for the human:
      - Graph execution is in progress: the emperor is awaiting the [GRAPH COMPLETE] or [GRAPH BLOCKED] reminder, or has said it will report when the run finishes (e.g. "等图执行结束再通知我"). The engine reminder wakes it automatically — injecting "continue" here is harmful, never do it.
      - The human must decide: a strategy awaiting required explicit approval, a destructive-operation approval gate, a pending host approval or accepted approval_required request, an open product/architecture question, or a request for clarification.
      - Continuing would do nothing useful, or the situation is too ambiguous.

      Advance (advance: true) with one short nudge only when the emperor is stuck on mechanics and nothing external will wake it:
      - A completion reminder already arrived in the transcript but the emperor has not collected the results, or is narrating instead of acting — nudge with "continue".
      - The emperor has a recoverable status query to collect — nudge with "inspect graph_status". State loss or unreadable storage requires recovery; never nudge it to repeat execution.

      Never approve anything on the human's behalf. Never fabricate facts, tool results, or user intent. replyText must be short and imperative. When in doubt, hand control back (advance: false).
    transcript:
      window_size: 30
      max_chars: 12000
      include_tools: true

disable_functions: [plan, execute, loop]
