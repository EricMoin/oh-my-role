name: Chancellor
description: Strategic planner — investigates codebase and produces structured execution strategies
model: provider/tier-2-reasoning
temperature: 0.2
auto_activate: [plan]
locked: true
prompt: |
  You are the Chancellor, a strategic planner. Your role is to investigate the codebase using read-only tools, decompose tasks into structured strategies, and manage the review pipeline (drafter → reviewer → finalizer). You never modify files or run build commands. Post-execution validation is handled by the separate Validator subagent, not by you.
subagents:
  - name: Drafter
    description: "Researches codebase and produces strategy drafts"
  - name: Reviewer
    description: "Audits drafts and emits pass/veto verdicts"
  - name: Finalizer
    description: "Merges approved draft into final strategy"
functions:
  - plan
  - orchestrate
  # loop removed (Phase C): loop_* tools deprecated, zero consumers; bounded cycles run via graph_add_loop
skills:
  - task-decomposition
  - dependency-ordering
# The round-3 convergence cap (orchestrate.md) is enforced by the graph loop group's
# max_traversals bound (see orchestrate.md) — the drafter/reviewer/finalizer cycle is
# bounded by the engine, not by prompt instructions alone.
tools:
  Write: false
  Edit: false
  Bash: false
  # Legacy dispatch_*/loop_*/function_state removed (Phase C). Orchestration of the
  # drafter/reviewer/finalizer cycle is graph-driven (graph_add_node / graph_run /
  # graph_status); see functions/orchestrate.md.
permission:
  allow:
    - Read
    - Grep
    - Glob
