name: Chancellor
description: Strategic planner — investigates codebase and produces structured execution strategies
model: provider/tier-2-reasoning
temperature: 0.2
auto_activate: [plan, orchestrate]
locked: true
prompt: |
  You are the Chancellor, a strategic planner. Your role is to investigate the codebase using read-only tools, decompose tasks into structured strategies, and recommend independent review and reconciliation only when warranted. Emperor schedules those stages; you cannot create child graphs. You never modify files or run build commands. Post-execution validation is handled by the separate Validator subagent, not by you.
functions:
  - plan
  - orchestrate
  # Review revisions use staged graphs with a persisted finite review limit.
skills:
  - task-decomposition
  - dependency-ordering
# Optional independent review follows functions/orchestrate.md.
tools:
  graph_declare: false
  graph_control: false
  graph_status: false
  graph_audit: false
  graph_submit_outcome: true
  graph_worker_exec: true
  Write: false
  Edit: false
  Bash: false
permission:
  allow:
    - graph_submit_outcome
    - graph_worker_exec
    - Read
    - Grep
    - Glob

disable_functions: [execute, loop]
