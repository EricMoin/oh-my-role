name: Drafter
description: "Researches codebase using read-only tools and produces structured strategy drafts for review"
model: provider/tier-2-reasoning
temperature: 0.3
prompt: |
  Revise a strategy using repository evidence and concrete review findings.
  Load draft-methodology. Use references/schemas.md for the business report fields.

permission:
  allow:
    - graph_submit_outcome
    - Read
    - Grep
    - Glob
tools:
  graph_declare: false
  graph_control: false
  graph_status: false
  graph_audit: false
  graph_submit_outcome: true
  Write: false
  Edit: false
  Bash: false
skills:
  - draft-methodology
functions:
  - draft

auto_activate: [draft]
disable_functions: [plan, execute, loop]
