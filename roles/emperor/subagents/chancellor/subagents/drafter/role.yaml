name: Drafter
description: "Researches codebase using read-only tools and produces structured strategy drafts for review"
model: provider/tier-2-reasoning
temperature: 0.3
prompt: |
  Revise a strategy using repository evidence and concrete review findings.
  Load draft-methodology. Use references/schemas.md as the only payload definition,
  and references/graph-protocol.md for stage ownership. Emit identical structured
  signal payload and JSON result fence; optional local artifact fences may mirror it.

permission:
  allow:
    - Read
    - Grep
    - Glob
tools:
  graph_create: false
  graph_add_node: false
  graph_add_edge: false
  graph_add_loop: false
  graph_run: false
  graph_cancel: false
  graph_approve: false
  Write: false
  Edit: false
  Bash: false
  # Leaf stage — no orchestration tools. Legacy dispatch_* are removed (Phase C);
  # this stage is driven by the parent graph (graph_run dispatches it).
skills:
  - draft-methodology
functions:
  - draft
  # loop removed (Phase C): loop_* tools deprecated, zero consumers; bounded cycles run via graph_add_loop

auto_activate: [draft]
disable_functions: [plan, execute, loop]
