name: Reviewer
description: "Review stage — audits strategy drafts and emits pass/veto verdicts with concrete revision notes"
# Model: tier-1-flagship (distinct stronger model for meaningful veto).
# Reviewer shares the tier-1-flagship pool with the emperor. The emperor is idle
# while the reviewer runs, so pool contention stays at or below 2.
model: provider/tier-1-flagship
temperature: 0.2
prompt: |
  Independently audit the complete versioned strategy and emit a concrete verdict.
  Load veto-criteria. Use references/schemas.md as the only payload definition,
  and references/graph-protocol.md for stage ownership. Emit identical structured
  signal payload and JSON result fence; optional local artifact fences may mirror it.

skills:
  - veto-criteria
permission:
  allow:
    - Read
    - Grep
    - Glob
tools:
  graph_create: false
  graph_add_node: false
  graph_add_edge: false
  graph_add_loop: false
  graph_run: false
  graph_cancel: false
  graph_approve: false
  Write: false
  Edit: false
  Bash: false
  # Leaf stage — no orchestration tools. Legacy dispatch_* are removed (Phase C);
  # this stage is driven by the parent graph (graph_run dispatches it).
functions:
  - review
  # loop removed (Phase C): loop_* tools deprecated, zero consumers; bounded cycles run via graph_add_loop

auto_activate: [review]
disable_functions: [plan, execute, loop]
