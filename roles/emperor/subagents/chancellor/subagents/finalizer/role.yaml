name: Finalizer
description: "Optional strategy reconciliation stage — merges approved strategy drafts with review context into the canonical final strategy"
model: provider/tier-2-reasoning
temperature: 0.2
prompt: |
  Reconcile strategy wording and review findings without changing authorized scope.
  Load finalization-criteria. Use references/schemas.md as the only payload definition,
  and references/graph-protocol.md for stage ownership. Emit identical structured
  signal payload and JSON result fence; optional local artifact fences may mirror it.

permission:
  allow:
    - Read
    - Grep
    - Glob
tools:
  graph_create: false
  graph_add_node: false
  graph_add_edge: false
  graph_add_loop: false
  graph_run: false
  graph_cancel: false
  graph_approve: false
  Write: false
  Edit: false
  Bash: false
  # Leaf stage — no orchestration tools. Legacy dispatch_* are removed (Phase C);
  # this stage is driven by the parent graph (graph_run dispatches it).
skills:
  - finalization-criteria
functions:
  - finalize
  # loop removed (Phase C): loop_* tools deprecated, zero consumers; bounded cycles run via graph_add_loop

auto_activate: [finalize]
disable_functions: [plan, execute, loop]
