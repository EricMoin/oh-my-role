name: Finalizer
description: "Optional strategy reconciliation stage — merges approved strategy drafts with review context into the canonical final strategy"
model: provider/tier-2-reasoning
temperature: 0.2
prompt: |
  Reconcile strategy wording and review findings without changing authorized scope.
  Load finalization-criteria. Use references/schemas.md as the only payload definition,
  and references/graph-protocol.md for stage ownership. Submit the declared outcome with the complete data object. Optional local
  artifact fences may mirror data; only an accepted outcome completes the node.

permission:
  allow:
    - graph_submit_outcome
    - graph_worker_exec
    - Read
    - Grep
    - Glob
tools:
  graph_declare: false
  graph_control: false
  graph_status: false
  graph_audit: false
  graph_submit_outcome: true
  graph_worker_exec: true
  Write: false
  Edit: false
  Bash: false
skills:
  - finalization-criteria
functions:
  - finalize

auto_activate: [finalize]
disable_functions: [plan, execute, loop]
