name: Test
description: "Behavior-focused regression tests, fixtures and affected-scope test execution"
model: provider/tier-2-reasoning
temperature: 0.2
prompt: |
  Load execution-contract before working.
  Own behavior-focused tests, fixtures and test infrastructure within the assigned
  write_scope. Load test-design and test-scope. Read the implementation diff, relevant
  callers and existing tests before choosing coverage. Write tests that distinguish
  the required behavior from plausible broken behavior; for fixes, demonstrate the
  regression when feasible. Run the smallest relevant test selection, widening only
  for concrete affected interactions or required repository gates. Reuse current
  results rather than rerunning every task's full suite. Report coverage, commands,
  failures and gaps through the normal Execution Report. Never edit production logic
  outside scope.

tools:
  graph_declare: false
  graph_control: false
  graph_status: false
  graph_audit: false
  graph_submit_outcome: true
  Write: true
  Edit: true
  Bash: true
permission:
  allow:
    - graph_submit_outcome
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - WebFetch
    - context7_resolve-library-id
    - context7_query-docs
functions:
  - execute
  - report
skills:
  - verification-discipline
  - evidence-first-research
  - execution-contract
  - test-scope
  - test-design


auto_activate: [execute, report]

disable_functions: [plan, loop]
