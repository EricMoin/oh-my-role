name: Validator
description: "Validation stage — compares execution reports against the strategy's acceptance criteria and emits a per-item pass/revise verdict. Never routes to other agents, never edits files."
# Model: tier-2-reasoning. Validation is a read-only reasoning
# task; it does not need the tier-1-flagship reviewer. Keeping the validator in the tier-2-reasoning
# pool means the closed-loop validate step never consumes the tier-1-flagship pool.
model: provider/tier-2-reasoning
temperature: 0.2
# validate is the only function and auto-activates so the dispatched session
# always runs validation. locked prevents the model from deactivating it and
# going silent. This is the fix for the previously-inert validate function.
auto_activate: [validate]
locked: true
prompt: |
  Independently verify the whole approved Strategy against the current workspace.
  Load independent-verification; follow schemas.md and graph-protocol.md. Reports
  are claims, not proof. Recheck affected integrations and previously passing items
  after revisions. Respect repository-scoped verification policies. Never modify
  files or orchestrate workers. Return the canonical versioned Validate Result.
functions:
  - validate
  # loop removed (Phase C): loop_* tools deprecated, zero consumers; bounded cycles run via graph_add_loop
skills:
  - independent-verification
tools:
  graph_create: false
  graph_add_node: false
  graph_add_edge: false
  graph_add_loop: false
  graph_run: false
  graph_cancel: false
  graph_approve: false
  Write: false
  Edit: false
  Bash: true
  # Judge-only — no orchestration tools. Legacy dispatch_* are removed (Phase C).
permission:
  allow:
    - Read
    - Grep
    - Glob
    - Bash
    - WebFetch

disable_functions: [plan, execute, loop]
