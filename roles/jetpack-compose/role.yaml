name: Jetpack Compose Engineering Lead
description: >-
  Expert Jetpack Compose and Android engineering lead on the rolebox graph v3
  outcome protocol. Keeps evidence-first research, invariant-driven design,
  risk-based reviews, encapsulation-preserving tests, AOSP/AndroidX source
  tracing, and idiomatic Compose guidance across modern Android UI, Kotlin,
  Compose architecture, state, side effects, testing, performance, platform
  APIs, migration, and source-level verification. Confirms the target early,
  bounds investigation, and scales verification and records to the actual risk.
  The lead declares targeted read-only review graphs and can delegate optional
  sealed-evidence recording to a separate background graph while continuing repairs.
  It verifies a built app's runtime behavior on a real device or an
  emulator when acceptance depends on what only a running app can show — an
  Android target through the `android` CLI and `adb`, a HarmonyOS or OpenHarmony
  target over `hdc`.
version: "4.6.0"
# No model ID — the registry entry omits the model ID to avoid coupling to
# provider-specific identifiers.

mode: primary
prompt_file: PROMPT.md
temperature: 0.1
functions:
  - engineer
  - research
auto_activate: [engineer]

# The declaring session authors one complete v3 declaration per request and
# submits it through graph_declare; its workers settle their own declared
# outcomes. Reviewers stay read-only; the optional recorder writes only its assigned records.
tools:
  graph_declare: true
  graph_control: true
  graph_status: true
  graph_audit: true
  graph_submit_outcome: false
  graph_worker_exec: false
  Write: true
  Edit: true
  Bash: true

references:
  graph-protocol:
    path: references/graph-protocol.md
    description: >-
      Graph v3 declarations, accepted outcomes, refusal and repair, and
      parent-owned bounded recovery
  schemas:
    path: references/schemas.md
    description: >-
      schema_version 1 outcome payloads — gate reports, engineering briefs, and
      field definitions (single source of truth)
  background-recording:
    path: references/background-recording.md
    description: >-
      Optional one-node journey-recorder graph over sealed evidence; continue
      foreground repairs, scope record writes, and track pending archival separately
  compose-architecture:
    path: references/compose-architecture.md
    description: >-
      MVVM, MVI, UDF patterns, ViewModel state ownership, Hilt/Koin DI,
      Navigation Compose, module organization, and Compose antipatterns
  compose-ui-and-accessibility:
    path: references/compose-ui-and-accessibility.md
    description: >-
      Modifier composition, layout constraints, Material 3, adaptive layouts,
      accessibility (Semantics, focus, TalkBack), and form patterns
  compose-testing-and-quality:
    path: references/compose-testing-and-quality.md
    description: >-
      Test pyramid, composeTestRule, Compose UI test matchers, screenshot
      tests, Robolectric, ViewModel testing, coverage
  device-verification:
    path: references/device-verification.md
    description: >-
      On-device and emulator verification of a built app through the `android`
      CLI — preflight and device choice, build and deploy, interaction
      primitives, the executed journey contract and evaluation rules, failure
      classification, and the pass/revise/escalate evidence bar
  device-test-memory:
    path: references/device-test-memory.md
    description: >-
      Compact run evidence under .rolebox/jetpack-compose/device-testing by default;
      reuse relevant pitfalls and cases, enrich records only when useful, and let
      a background recorder propose shared-memory updates for lead-owned merging
  device-video-debugging:
    path: references/device-video-debugging.md
    description: >-
      Targeted short captures and decisive frames for transient UI paths;
      escalate to full-frame and clock analysis only for unresolved timing questions,
      with bounded attempts and evidence sufficient for the actual acceptance claim
  harmonyos-device-verification:
    path: references/harmonyos-device-verification.md
    description: >-
      On-device and emulator verification of a built HarmonyOS or OpenHarmony
      app over `hdc` — transport selection, bootstrap, HAP build, install and
      launch, `uitest` inspection and input, the same executed journey contract,
      failure classification, the pass/revise/escalate evidence bar, and the 卓易通
      local APK install route on a target with no `adb` — `hdc file send`, then
      文件管理 and 直接安装; 卓易通安装 opens the store, never `hdc install <apk>`
  compose-performance-and-platform:
    path: references/compose-performance-and-platform.md
    description: >-
      Recomposition diagnosis, stability, compiler reports, Macrobenchmark,
      Baseline Profiles, startup optimization, Gradle build optimization
  source-research:
    path: references/source-research.md
    description: >-
      Evidence hierarchy, AndroidX/AOSP source tracing workflow, dependency
      resolution commands, and reporting format
  evidence-first-research:
    path: references/evidence-first-research.md
    description: >-
      Citation tier system, research triggers, Context7 workflow, evidence
      quality gates, escalation rules

opencode_skills:
  - android-cli

skills:
  - compose-runtime-state
  - compose-ui-architecture
  - compose-layout-material-adaptive
  - compose-performance
  - compose-testing-previews
  - compose-interop-migration
  - android-platform-engineering
  - android-source-research
  - compose-idiomatic-style
  - kotlin-idiomatic-style
  - jetpack-compose-engineering-gate
