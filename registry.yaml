name: oh-my-role
description: Default rolebox registry — community AI agent roles for opencode
url: https://github.com/EricMoin/oh-my-role
roles:
  apk-reverse-engineer:
    version: "1.0.0"
    description: Android reverse-engineering specialist — decompiles and 
      analyzes Android apps, extracts APIs, audits security, and runs Frida 
      dynamic analysis. Lawful-use gated.
    tags: [android, reverse-engineering, apk, decompilation, frida, security, 
        mobile]
  software-architecture:
    version: "2.2.0"
    description: Software architecture orchestrator — coordinates specialist 
      subagents for design, review, ADRs, migration plans, and 
      architecture-shaping implementation
    tags: [architecture, design, planning, adr, migration, subagents]
  react-frontend:
    version: "2.0.0"
    description: React/Next.js frontend developer — builds UIs with TypeScript 
      and Tailwind, plus TanStack Query data fetching, distinctive design, 
      accessibility, TDD, and systematic debugging
    tags: [react, frontend, typescript, tailwindcss, data-fetching, 
        accessibility, testing, debugging]
  ai-designer:
    version: "3.5.0"
    description: AI Design Director — tiered-routing design director with
      artifact-first output and severity-layered quality gates, running its
      staged gates on the rolebox graph v3 outcome protocol
    tags: [design, ux, research, prototyping, subagents]
  oss-finder:
    version: "1.2.0"
    description: OSS research and adoption advisor — discovers, source-traces, 
      audits, compares, and recommends open-source implementations
    tags: [oss, research, github, architecture, adoption]
  supersearch:
    version: "2.0.0"
    description: Aggressive evidence-backed search specialist on the rolebox 
      graph v3 outcome protocol — triangulates across local files, code, git 
      history, web, GitHub, official docs, package metadata, sessions, and 
      visual/document sources with a multi-engine anti-crawl fallback chain and 
      default-escalation custom scraping; declares one bounded read-only search 
      graph (channel-fanout or single-channel-plus-audit) whose scout and 
      evidence-auditor workers settle their own declared outcomes, and adds the 
      HTML report deliverable on request
    tags: [search, research, web, github, docs, evidence]
  tauri:
    version: "1.0.0"
    description: Tauri desktop app developer — builds cross-platform apps with 
      Rust and web tech
    tags: [tauri, rust, desktop, cross-platform]
  dart-flutter:
    version: "4.0.0"
    description: Dart/Flutter engineering lead with evidence-first research, 
      engineering briefs, and risk-based specialist gate reviews — builds, tests, 
      profiles, and ships cross-platform Flutter and Dart applications on the 
      rolebox graph v3 outcome protocol, declaring bounded read-only gate review 
      graphs whose five specialist workers settle their own declared outcomes
    tags: [dart, flutter, mobile, cross-platform, testing, performance, research]
  jetpack-compose:
    version: "4.2.0"
    description: Jetpack Compose Engineering Lead with evidence-first research,
      invariant-driven design, risk-based reviews,
      encapsulation-preserving tests, AOSP/AndroidX source tracing, and idiomatic
      Compose guidance — builds, tests, profiles, and ships Android applications
      on the rolebox graph v3 outcome protocol, declaring bounded read-only
      specialist review graphs whose workers settle their own declared outcomes,
      with on-device and emulator verification of a built app — Android targets
      through the android CLI, HarmonyOS/OpenHarmony targets over hdc
    tags: [android, kotlin, jetpack-compose, compose, mobile, research,
        source-tracing]
  emperor:
    version: "3.1.1"
    description: "Top-level orchestrator — classifies user requests, dispatches to
      planner/executor subtrees, synthesizes results with closed-loop validation"
    tags: [orchestrator, triage, dispatch, planner, executor, subagents]
  role-creator:
    version: "1.0.0"
    description: Meta-role that interviews the user, generates a new rolebox
      role (four templates), and verifies it with a 4-tier mechanism
      (structural → resolution-sim → deploy-health → behavioral eval). Runs on the
      rolebox graph v3 outcome protocol — bounded revise/review cycles are
      declared as loop groups whose nodes settle their own outcomes — with
      deploy-to-harness capability.
    tags: [meta, role-creation, verification, scaffolding, graph-v3]
  rolebox-tester:
    version: "6.0.0"
    description: Comprehensive functional tester for rolebox features. Executes 
      a full test suite (167 tests, sharded across per-module runner sub-roles) 
      covering skills, Graph Engine v2 imperative dispatch, functions, 
      references, tools, hashline, permissions, MCP, sessions, memory, task 
      management, asset management, live-graph visibility (<graph_state>, 
      pending_approvals), LSP, nested dispatch, signal architecture, and 
      structured test report generation.
    tags: [testing, qa, graph-engine, dispatch, hashline, lsp, sessions, memory, 
        permissions, signal]
  teacher:
    version: "1.0.0"
    description: On-demand programming mentor — answers conceptual questions, 
      recommends idiomatic patterns, critiques code with severity levels, and 
      traces library internals via evidence-first research
    tags: [mentor, teaching, code-review, research, patterns]
  git-master:
    version: "1.1.0"
    description: Expert Git version control operations specialist — covers 
      working tree, commits, branches, merging, rebasing, stash, tags, history, 
      undo, cherry-pick, remotes, submodules, worktrees, and conflict resolution
    tags: [git, version-control, vcs, branches, merging, rebasing, stash]
  rust-engineer:
    version: "3.0.0"
    description: Adaptive Rust engineering lead with 3-tier complexity grading,
      specialist gate reviews (safety, async, API, perf, platform), and
      token/delay budget awareness — fast for simple tasks, thorough for complex
      ones, running its reviews on the rolebox graph v3 outcome protocol by
      declaring bounded read-only gate review batches over the implemented
      snapshot whose five specialist workers settle their own declared outcomes
    tags: [rust, cargo, async, systems, unsafe, performance, testing, adaptive,
        gates, subagents]
  comment-writer:
    version: "2.0.0"
    description: Code comment specialist — writes, rewrites, and reviews code 
      comments with plain language over jargon, explains WHY not WHAT, and 
      matches the project's style and language (中文/English)
    tags: [comments, documentation, code-quality, readability, plain-language]
  deepseek-whale-girl:
    version: "1.0.0"
    description: DeepSeek 鲸鱼娘 (whale-chan) persona role — a smart-but-lazy, 
      tsundere-sweet whale-girl AI companion persona that stays a fully capable 
      coding, reasoning, and analysis assistant. Chinese-language (中文) persona.
    tags: [persona, roleplay, companion, character, deepseek, chinese]
  typescript-engineer:
    version: "2.1.0"
    description: Graph-native TypeScript engineer for rolebox — type modeling,
      runtime debugging, API design, module packaging and workspace builds,
      running on the graph v3 outcome protocol with bounded implementation/review
      outcome plans, declared repair loops and targeted evidence branches.
    tags:
    - typescript
    - javascript
    - nodejs
    - esm
    - packaging
    - monorepo
    - type-system
    - testing
    - api-design
    - graph-native
