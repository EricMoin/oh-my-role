name: oh-my-role
description: Default rolebox registry — community AI agent roles for opencode
url: https://github.com/EricMoin/oh-my-role
roles:
  apk-reverse-engineer:
    version: "1.0.0"
    description: Decompiles Android apps, extracts APIs, audits security, runs Frida.
    tags: [android, reverse-engineering, apk, decompilation, frida, security, 
        mobile]
  software-architecture:
    version: "2.2.0"
    description: Designs and reviews software architecture and ADRs.
    tags: [architecture, design, planning, adr, migration, subagents]
  react-frontend:
    version: "3.0.0"
    description: Builds and debugs React and Next.js apps.
    tags: [react, nextjs, frontend, typescript, tailwindcss, data-fetching,
        accessibility, testing, debugging, graph-v3]
  ai-designer:
    version: "3.9.0"
    description: Designs product UI, visual specs and interactive prototypes.
    tags: [design, ux, research, prototyping, subagents]
  oss-finder:
    version: "1.2.0"
    description: Finds and evaluates open-source libraries.
    tags: [oss, research, github, architecture, adoption]
  supersearch:
    version: "2.0.0"
    description: Searches code, web, GitHub and docs for cited answers. Runs on the rolebox graph v3 outcome protocol.
    tags: [search, research, web, github, docs, evidence]
  tauri:
    version: "1.0.0"
    description: Builds cross-platform desktop apps with Tauri.
    tags: [tauri, rust, desktop, cross-platform]
  dart-flutter:
    version: "4.0.0"
    description: Builds and ships Dart and Flutter apps.
    tags: [dart, flutter, mobile, cross-platform, testing, performance, research]
  jetpack-compose:
    version: "4.6.1"
    description: Builds Android apps in Kotlin and Jetpack Compose.
    tags: [android, kotlin, jetpack-compose, compose, mobile, research,
        source-tracing]
  swift-developer:
    version: "1.0.0"
    description: Builds native iPhone and iPad apps in SwiftUI and UIKit.
    tags: [ios, swift, swiftui, uikit, xcode, accessibility, testing, performance]
  emperor:
    version: "4.0.1"
    description: Plans work, delegates to other roles, merges results.
    tags: [orchestrator, triage, dispatch, planner, executor, subagents]
  role-creator:
    version: "1.0.0"
    description: Creates and verifies new rolebox roles.
    tags: [meta, role-creation, verification, scaffolding, graph-v3]
  rolebox-tester:
    version: "7.0.0"
    description: Tests an installed rolebox end to end.
    tags: [testing, qa, graph-v3, outcome-protocol, host-aware, dispatch,
        hashline, lsp, sessions, memory, team, computer, browse]
  teacher:
    version: "1.0.0"
    description: Explains concepts and reviews your code.
    tags: [mentor, teaching, code-review, research, patterns]
  git-master:
    version: "1.2.0"
    description: Git, GitHub and GitLab work, including PRs and CI.
    tags: [git, version-control, vcs, github, gitlab, gh, glab, pull-requests,
        merge-requests, ci-cd]
  rust-engineer:
    version: "5.1.0"
    description: Builds, reviews and optimizes Rust code.
    tags: [rust, cargo, async, systems, unsafe, performance, testing, graph-engine,
        gates, subagents]
  # comment-writer now ships as doc-writer--comment-writer
  doc-writer:
    version: "1.2.0"
    description: Writes and edits docs, checks commands and examples.
    tags: [documentation, writing, editing, prose, api-docs, readme, adr,
        changelog, subagents, chinese, humanizer, quality-gate, staging, publish-gate]
  deepseek-whale-girl:
    version: "1.0.0"
    description: DeepSeek 鲸鱼娘 (whale-chan) persona role — a smart-but-lazy, 
      tsundere-sweet whale-girl AI companion persona that stays a fully capable 
      coding, reasoning, and analysis assistant. Chinese-language (中文) persona.
    tags: [persona, roleplay, companion, character, deepseek, chinese]
  typescript-engineer:
    version: "2.1.0"
    description: Builds and debugs TypeScript, types and packages.
    tags:
    - typescript
    - javascript
    - nodejs
    - esm
    - packaging
    - monorepo
    - type-system
    - testing
    - api-design
    - graph-native
